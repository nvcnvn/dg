# The documentation site; docs/development.md says how it is built and checked.
title: dg
description: Diagram-as-code with an HCL model, a layout arranged in the browser, and arrows routed every time it draws.
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
webmaster_verifications:
  google: N9iFKuvFud-Nh0X26v1Fn4Upy0UrpY-q0Tm9u3nfkHM
titles_from_headings:
  strip_title: true
optional_front_matter:
  remove_originals: true
header_pages:
  - docs/playground.md
  - docs/getting-started.md
  - docs/vscode.md
  - docs/examples.md
  - docs/packs.md
  - docs/reference/README.md
exclude:
  - CLAUDE.md
  - LICENSE
  - THIRD_PARTY_NOTICES
  - Makefile
  - install.sh
  - go.mod
  - go.sum
  - cmd
  - internal
  - web
  - vscode
  - packs
  - skills
  - examples
  - docs/media
  - docs/open-decisions.md
  - docs/tech-debts.md
  - testdata/check
  - testdata/fmt
  - testdata/gif
  - testdata/ids
  - testdata/inert
  - testdata/lift
  - testdata/lsp
  - testdata/ops
  - testdata/rebuild
  - testdata/resolve
  - testdata/export/*.json
