<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>dg</title>
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <header id="bar" aria-label="Toolbar"></header>
    <main id="main">
      <aside id="palette" aria-label="Palette"><h2>Kinds</h2><input id="palette-filter" type="search" placeholder="Filter" aria-label="Filter kinds" /><div id="kinds"></div></aside>
      <div id="stage">
        <div id="canvas" tabindex="0" role="region" aria-label="Canvas"><div id="paper"></div></div>
        <div id="top">
          <section id="diagnostics" aria-label="Diagnostics" hidden></section>
          <p id="guide" hidden>Drag from a node, port or row to another. Esc to finish.</p>
          <p id="hint" hidden>Placed automatically. Drag a node to keep this arrangement.</p>
        </div>
        <p id="empty" hidden>Drag a kind from the palette, or click one, to add a node</p>
        <section id="broken" aria-label="Errors" hidden></section>
        <div id="status" role="status"></div>
      </div>
      <aside id="inspector" aria-label="Inspector"></aside>
    </main>
    <div id="overflow-menu" role="group" aria-label="More tools" hidden></div>
    <div id="tool-menu" role="menu" aria-label="Tool menu" hidden></div>
    <div id="drill-menu" role="menu" aria-label="Views" hidden></div>
    <div id="context-menu" role="menu" aria-label="Context menu" hidden></div>
    <div id="tip" role="tooltip" hidden></div>
    <div id="toast" role="status" hidden></div>
    <dialog id="dialog"></dialog>
  </body>
</html>
