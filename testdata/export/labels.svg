<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 290 440" width="290" height="440" font-family="Inter, sans-serif">
<g data-node="cluster">
<rect x="10" y="140" width="180" height="270" fill="#F8F9FA" stroke="#9AA0A6" stroke-width="1"/>
<text x="30" y="165" fill="#202124" font-size="14" font-weight="700">GPU cluster</text>
<text x="30" y="182" fill="#5F6368" font-size="11">Hanoi data center</text>
</g>
<g data-node="gateway">
<rect x="90" y="10" width="170" height="60" fill="#FFFFFF" stroke="#3C4043" stroke-width="1"/>
<text x="175" y="37" text-anchor="middle" fill="#202124" font-size="14" font-weight="700">Inference gateway</text>
<text x="175" y="54" text-anchor="middle" fill="#5F6368" font-size="11">Routes requests to a model</text>
</g>
<g data-node="storage">
<rect x="30" y="206" width="120" height="60" fill="#FFFFFF" stroke="#3C4043" stroke-width="1"/>
<text x="90" y="233" text-anchor="middle" fill="#202124" font-size="14" font-weight="700">Model storage</text>
<text x="90" y="250" text-anchor="middle" fill="#5F6368" font-size="11">Holds the weights</text>
</g>
<g data-node="workers">
<rect x="50" y="326" width="120" height="60" fill="#FFFFFF" stroke="#3C4043" stroke-width="1"/>
<text x="110" y="353" text-anchor="middle" fill="#202124" font-size="14" font-weight="700">Workers</text>
<text x="110" y="370" text-anchor="middle" fill="#5F6368" font-size="11">Serve the models</text>
</g>
<g data-edge="requests">
<path d="M175 70 L175 314 L130 314 L130 326" fill="none" stroke="#3C4043" stroke-width="1.5"/>
<path d="M125 316 L130 326 L135 316" fill="none" stroke="#3C4043" stroke-width="1.5"/>
</g>
<g data-edge="weights">
<path d="M90 266 L90 326" fill="none" stroke="#3C4043" stroke-width="1.5"/>
<path d="M85 316 L90 326 L95 316" fill="none" stroke="#3C4043" stroke-width="1.5"/>
</g>
</svg>
