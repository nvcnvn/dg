<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 280 440" width="280" height="440" font-family="Inter, sans-serif">
<g data-node="cluster">
<rect x="10" y="140" width="190" height="270" fill="#F8F9FA" stroke="#9AA0A6" stroke-width="1"/>
<text x="30" y="165" fill="#202124" font-size="14" font-weight="700">GPU cluster</text>
<text x="30" y="182" fill="#5F6368" font-size="11">Hanoi data center</text>
</g>
<g data-node="gateway">
<rect x="100" y="10" width="150" height="60" fill="#FFFFFF" stroke="#3C4043" stroke-width="1"/>
<text x="175" y="37" text-anchor="middle" fill="#202124" font-size="14" font-weight="700">Inference gateway</text>
<text x="175" y="54" text-anchor="middle" fill="#5F6368" font-size="11">3 replicas, 2 vCPU each</text>
</g>
<g data-node="storage">
