<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -10 760 1470" width="760" height="1470" font-family="Inter, sans-serif">
<g data-node="banking">
<rect x="110" y="240" width="580" height="990" fill="none" stroke="#444444" stroke-width="1" stroke-dasharray="8 4"/>
<text x="130" y="265" fill="#444444" font-size="14">Internet Banking System</text>
<text x="130" y="285" fill="#444444" font-size="14">[Software System]</text>
</g>
<g data-node="customer">
<rect x="50" y="48" width="220" height="122" rx="24" fill="#08427B" stroke="#073B6F" stroke-width="1"/>
<circle cx="160" cy="34" r="24" fill="#08427B" stroke="#073B6F" stroke-width="1"/>
<text x="160" y="74" text-anchor="middle" fill="#FFFFFF" font-size="14">Personal Banking Customer</text>
<text x="160" y="94" text-anchor="middle" fill="#FFFFFF" font-size="14">[Person]</text>
<text x="160" y="114" text-anchor="middle" fill="#FFFFFF" font-size="14"></text>
<text x="160" y="134" text-anchor="middle" fill="#FFFFFF" font-size="14">A customer of the bank, with</text>
<text x="160" y="154" text-anchor="middle" fill="#FFFFFF" font-size="14">personal bank accounts.</text>
</g>
<g data-node="email">
<rect x="10" y="1290" width="240" height="130" rx="8" fill="#999999" stroke="#8A8A8A" stroke-width="1"/>
<text x="130" y="1320" text-anchor="middle" fill="#FFFFFF" font-size="14">E-mail System</text>
<text x="130" y="1340" text-anchor="middle" fill="#FFFFFF" font-size="14">[Software System]</text>
<text x="130" y="1360" text-anchor="middle" fill="#FFFFFF" font-size="14"></text>
<text x="130" y="1380" text-anchor="middle" fill="#FFFFFF" font-size="14">The internal Microsoft Exchange</text>
<text x="130" y="1400" text-anchor="middle" fill="#FFFFFF" font-size="14">e-mail system.</text>
</g>
<g data-node="mainframe">
<rect x="310" y="1290" width="220" height="150" rx="8" fill="#999999" stroke="#8A8A8A" stroke-width="1"/>
<text x="420" y="1320" text-anchor="middle" fill="#FFFFFF" font-size="14">Mainframe Banking System</text>
<text x="420" y="1340" text-anchor="middle" fill="#FFFFFF" font-size="14">[Software System]</text>
<text x="420" y="1360" text-anchor="middle" fill="#FFFFFF" font-size="14"></text>
<text x="420" y="1380" text-anchor="middle" fill="#FFFFFF" font-size="14">Stores all of the core banking</text>
<text x="420" y="1400" text-anchor="middle" fill="#FFFFFF" font-size="14">information about customers,</text>
<text x="420" y="1420" text-anchor="middle" fill="#FFFFFF" font-size="14">accounts, transactions, etc.</text>
</g>
<g data-node="api">
<rect x="210" y="790" width="240" height="170" rx="8" fill="#438DD5" stroke="#3C7FC0" stroke-width="1"/>
<text x="330" y="820" text-anchor="middle" fill="#FFFFFF" font-size="14">API Application</text>
<text x="330" y="840" text-anchor="middle" fill="#FFFFFF" font-size="14">[Container: Java and Spring</text>
<text x="330" y="860" text-anchor="middle" fill="#FFFFFF" font-size="14">MVC]</text>
<text x="330" y="880" text-anchor="middle" fill="#FFFFFF" font-size="14"></text>
<text x="330" y="900" text-anchor="middle" fill="#FFFFFF" font-size="14">Provides Internet banking</text>
<text x="330" y="920" text-anchor="middle" fill="#FFFFFF" font-size="14">functionality via a JSON/HTTPS</text>
<text x="330" y="940" text-anchor="middle" fill="#FFFFFF" font-size="14">API.</text>
</g>
<g data-node="database">
<path d="M150 1027 L150 1203 A120 7 0 0 0 390 1203 L390 1027 A120 7 0 0 0 150 1027 Z" fill="#438DD5" stroke="#3C7FC0" stroke-width="1"/>
<path d="M150 1027 A120 7 0 0 0 390 1027" fill="none" stroke="#3C7FC0" stroke-width="1"/>
<text x="270" y="1064" text-anchor="middle" fill="#FFFFFF" font-size="14">Database</text>
<text x="270" y="1084" text-anchor="middle" fill="#FFFFFF" font-size="14">[Container: Oracle Database</text>
<text x="270" y="1104" text-anchor="middle" fill="#FFFFFF" font-size="14">Schema]</text>
<text x="270" y="1124" text-anchor="middle" fill="#FFFFFF" font-size="14"></text>
<text x="270" y="1144" text-anchor="middle" fill="#FFFFFF" font-size="14">Stores user registration</text>
<text x="270" y="1164" text-anchor="middle" fill="#FFFFFF" font-size="14">information, hashed credentials,</text>
<text x="270" y="1184" text-anchor="middle" fill="#FFFFFF" font-size="14">access logs, etc.</text>
</g>
<g data-node="mobile-app">
<rect x="430" y="550" width="240" height="170" rx="8" fill="#438DD5" stroke="#3C7FC0" stroke-width="1"/>
<text x="550" y="580" text-anchor="middle" fill="#FFFFFF" font-size="14">Mobile App</text>
<text x="550" y="600" text-anchor="middle" fill="#FFFFFF" font-size="14">[Container: Xamarin]</text>
<text x="550" y="620" text-anchor="middle" fill="#FFFFFF" font-size="14"></text>
<text x="550" y="640" text-anchor="middle" fill="#FFFFFF" font-size="14">Provides a limited subset of the</text>
<text x="550" y="660" text-anchor="middle" fill="#FFFFFF" font-size="14">Internet banking functionality to</text>
<text x="550" y="680" text-anchor="middle" fill="#FFFFFF" font-size="14">customers via their mobile</text>
<text x="550" y="700" text-anchor="middle" fill="#FFFFFF" font-size="14">device.</text>
</g>
<g data-node="spa">
<rect x="180" y="540" width="210" height="190" rx="8" fill="#438DD5" stroke="#3C7FC0" stroke-width="1"/>
<text x="285" y="570" text-anchor="middle" fill="#FFFFFF" font-size="14">Single-Page Application</text>
<text x="285" y="590" text-anchor="middle" fill="#FFFFFF" font-size="14">[Container: JavaScript and</text>
<text x="285" y="610" text-anchor="middle" fill="#FFFFFF" font-size="14">Angular]</text>
<text x="285" y="630" text-anchor="middle" fill="#FFFFFF" font-size="14"></text>
<text x="285" y="650" text-anchor="middle" fill="#FFFFFF" font-size="14">Provides all of the Internet</text>
<text x="285" y="670" text-anchor="middle" fill="#FFFFFF" font-size="14">banking functionality to</text>
<text x="285" y="690" text-anchor="middle" fill="#FFFFFF" font-size="14">customers via their web</text>
<text x="285" y="710" text-anchor="middle" fill="#FFFFFF" font-size="14">browser.</text>
</g>
<g data-node="web-app">
<rect x="130" y="310" width="240" height="170" rx="8" fill="#438DD5" stroke="#3C7FC0" stroke-width="1"/>
<text x="250" y="340" text-anchor="middle" fill="#FFFFFF" font-size="14">Web Application</text>
<text x="250" y="360" text-anchor="middle" fill="#FFFFFF" font-size="14">[Container: Java and Spring</text>
<text x="250" y="380" text-anchor="middle" fill="#FFFFFF" font-size="14">MVC]</text>
<text x="250" y="400" text-anchor="middle" fill="#FFFFFF" font-size="14"></text>
<text x="250" y="420" text-anchor="middle" fill="#FFFFFF" font-size="14">Delivers the static content and</text>
<text x="250" y="440" text-anchor="middle" fill="#FFFFFF" font-size="14">the Internet banking single page</text>
<text x="250" y="460" text-anchor="middle" fill="#FFFFFF" font-size="14">application.</text>
</g>
