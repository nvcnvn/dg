<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -10 760 1610" width="760" height="1610" font-family="Inter, sans-serif">
<g data-node="banking">
<rect x="110" y="240" width="580" height="1120" fill="none" stroke="#444444" stroke-width="1" stroke-dasharray="8 4"/>
<text x="130" y="265" fill="#444444" font-size="14">Internet Banking System</text>
<text x="130" y="285" fill="#444444" font-size="14">[Software System]</text>
<text x="130" y="305" fill="#444444" font-size="14"></text>
<text x="130" y="325" fill="#444444" font-size="14">Allows customers to view</text>
<text x="130" y="345" fill="#444444" font-size="14">information about their bank</text>
<text x="130" y="365" fill="#444444" font-size="14">accounts, and make</text>
<text x="130" y="385" fill="#444444" font-size="14">payments.</text>
</g>
<g data-node="customer">
<rect x="50" y="48" width="220" height="122" rx="24" fill="#08427B" stroke="#073B6F" stroke-width="1"/>
<circle cx="160" cy="34" r="24" fill="#08427B" stroke="#073B6F" stroke-width="1"/>
<text x="160" y="74" text-anchor="middle" fill="#FFFFFF" font-size="14">Personal Banking Customer</text>
<text x="160" y="94" text-anchor="middle" fill="#FFFFFF" font-size="14">[Person]</text>
<text x="160" y="114" text-anchor="middle" fill="#FFFFFF" font-size="14"></text>
<text x="160" y="134" text-anchor="middle" fill="#FFFFFF" font-size="14">A customer of the bank, with</text>
<text x="160" y="154" text-anchor="middle" fill="#FFFFFF" font-size="14">personal bank accounts.</text>
</g>
<g data-node="email">
<rect x="10" y="1420" width="240" height="130" rx="8" fill="#999999" stroke="#8A8A8A" stroke-width="1"/>
<text x="130" y="1450" text-anchor="middle" fill="#FFFFFF" font-size="14">E-mail System</text>
<text x="130" y="1470" text-anchor="middle" fill="#FFFFFF" font-size="14">[Software System]</text>
<text x="130" y="1490" text-anchor="middle" fill="#FFFFFF" font-size="14"></text>
<text x="130" y="1510" text-anchor="middle" fill="#FFFFFF" font-size="14">The internal Microsoft Exchange</text>
<text x="130" y="1530" text-anchor="middle" fill="#FFFFFF" font-size="14">e-mail system.</text>
</g>
<g data-node="mainframe">
<rect x="300" y="1420" width="220" height="160" rx="8" fill="#999999" stroke="#8A8A8A" stroke-width="1"/>
<text x="410" y="1447" text-anchor="middle" fill="#FFFFFF" font-size="14">Mainframe Banking System</text>
<text x="410" y="1467" text-anchor="middle" fill="#FFFFFF" font-size="14">[Software System]</text>
<text x="410" y="1487" text-anchor="middle" fill="#FFFFFF" font-size="14"></text>
<text x="410" y="1507" text-anchor="middle" fill="#FFFFFF" font-size="14">Stores all of the core banking</text>
<text x="410" y="1527" text-anchor="middle" fill="#FFFFFF" font-size="14">information about customers,</text>
<text x="410" y="1547" text-anchor="middle" fill="#FFFFFF" font-size="14">accounts, transactions, etc.</text>
<g data-collapsed="">
<rect x="404" y="1556" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#3C4043"/>
<path d="M407 1562 H413 M410 1559 V1565" stroke="#3C4043" stroke-width="2"/>
</g>
</g>
<g data-node="api">
<rect x="210" y="890" width="240" height="180" rx="8" fill="#438DD5" stroke="#3C7FC0" stroke-width="1"/>
<text x="330" y="917" text-anchor="middle" fill="#FFFFFF" font-size="14">API Application</text>
<text x="330" y="937" text-anchor="middle" fill="#FFFFFF" font-size="14">[Container: Java and Spring</text>
<text x="330" y="957" text-anchor="middle" fill="#FFFFFF" font-size="14">MVC]</text>
<text x="330" y="977" text-anchor="middle" fill="#FFFFFF" font-size="14"></text>
<text x="330" y="997" text-anchor="middle" fill="#FFFFFF" font-size="14">Provides Internet banking</text>
<text x="330" y="1017" text-anchor="middle" fill="#FFFFFF" font-size="14">functionality via a JSON/HTTPS</text>
<text x="330" y="1037" text-anchor="middle" fill="#FFFFFF" font-size="14">API.</text>
<g data-collapsed="">
<rect x="324" y="1046" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#3C4043"/>
<path d="M327 1052 H333 M330 1049 V1055" stroke="#3C4043" stroke-width="2"/>
</g>
</g>
<g data-node="database">
<path d="M160 1137 L160 1333 A110 7 0 0 0 380 1333 L380 1137 A110 7 0 0 0 160 1137 Z" fill="#438DD5" stroke="#3C7FC0" stroke-width="1"/>
<path d="M160 1137 A110 7 0 0 0 380 1137" fill="none" stroke="#3C7FC0" stroke-width="1"/>
<text x="270" y="1174" text-anchor="middle" fill="#FFFFFF" font-size="14">Database</text>
<text x="270" y="1194" text-anchor="middle" fill="#FFFFFF" font-size="14">[Container: Oracle Database</text>
<text x="270" y="1214" text-anchor="middle" fill="#FFFFFF" font-size="14">Schema]</text>
<text x="270" y="1234" text-anchor="middle" fill="#FFFFFF" font-size="14"></text>
<text x="270" y="1254" text-anchor="middle" fill="#FFFFFF" font-size="14">Stores user registration</text>
<text x="270" y="1274" text-anchor="middle" fill="#FFFFFF" font-size="14">information, hashed</text>
<text x="270" y="1294" text-anchor="middle" fill="#FFFFFF" font-size="14">authentication credentials,</text>
<text x="270" y="1314" text-anchor="middle" fill="#FFFFFF" font-size="14">access logs, etc.</text>
</g>
<g data-node="mobile-app">
<rect x="430" y="650" width="240" height="170" rx="8" fill="#438DD5" stroke="#3C7FC0" stroke-width="1"/>
<text x="550" y="680" text-anchor="middle" fill="#FFFFFF" font-size="14">Mobile App</text>
<text x="550" y="700" text-anchor="middle" fill="#FFFFFF" font-size="14">[Container: Xamarin]</text>
<text x="550" y="720" text-anchor="middle" fill="#FFFFFF" font-size="14"></text>
<text x="550" y="740" text-anchor="middle" fill="#FFFFFF" font-size="14">Provides a limited subset of the</text>
<text x="550" y="760" text-anchor="middle" fill="#FFFFFF" font-size="14">Internet banking functionality to</text>
<text x="550" y="780" text-anchor="middle" fill="#FFFFFF" font-size="14">customers via their mobile</text>
<text x="550" y="800" text-anchor="middle" fill="#FFFFFF" font-size="14">device.</text>
</g>
<g data-node="spa">
<rect x="180" y="640" width="210" height="190" rx="8" fill="#438DD5" stroke="#3C7FC0" stroke-width="1"/>
<text x="285" y="670" text-anchor="middle" fill="#FFFFFF" font-size="14">Single-Page Application</text>
<text x="285" y="690" text-anchor="middle" fill="#FFFFFF" font-size="14">[Container: JavaScript and</text>
<text x="285" y="710" text-anchor="middle" fill="#FFFFFF" font-size="14">Angular]</text>
<text x="285" y="730" text-anchor="middle" fill="#FFFFFF" font-size="14"></text>
<text x="285" y="750" text-anchor="middle" fill="#FFFFFF" font-size="14">Provides all of the Internet</text>
<text x="285" y="770" text-anchor="middle" fill="#FFFFFF" font-size="14">banking functionality to</text>
<text x="285" y="790" text-anchor="middle" fill="#FFFFFF" font-size="14">customers via their web</text>
<text x="285" y="810" text-anchor="middle" fill="#FFFFFF" font-size="14">browser.</text>
</g>
<g data-node="web-app">
<rect x="130" y="410" width="240" height="170" rx="8" fill="#438DD5" stroke="#3C7FC0" stroke-width="1"/>
<text x="250" y="440" text-anchor="middle" fill="#FFFFFF" font-size="14">Web Application</text>
<text x="250" y="460" text-anchor="middle" fill="#FFFFFF" font-size="14">[Container: Java and Spring</text>
<text x="250" y="480" text-anchor="middle" fill="#FFFFFF" font-size="14">MVC]</text>
<text x="250" y="500" text-anchor="middle" fill="#FFFFFF" font-size="14"></text>
<text x="250" y="520" text-anchor="middle" fill="#FFFFFF" font-size="14">Delivers the static content and</text>
<text x="250" y="540" text-anchor="middle" fill="#FFFFFF" font-size="14">the Internet banking single page</text>
<text x="250" y="560" text-anchor="middle" fill="#FFFFFF" font-size="14">application.</text>
</g>
