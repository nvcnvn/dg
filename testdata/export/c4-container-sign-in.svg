<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 370 1030" width="370" height="1030" font-family="Inter, sans-serif">
<style>
@keyframes dg-flow-0 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -10px; } }
.dg-flow-0 { animation: dg-flow-0 500ms linear infinite; }
</style>
<g data-node="banking">
<rect x="10" y="240" width="280" height="760" fill="none" stroke="#444444" stroke-width="1" stroke-dasharray="8 4"/>
<text x="30" y="265" fill="#444444" font-size="14">Internet Banking System</text>
<text x="30" y="285" fill="#444444" font-size="14">[Software System]</text>
</g>
<g data-node="customer">
<rect x="40" y="48" width="220" height="122" rx="24" fill="#08427B" stroke="#073B6F" stroke-width="1"/>
<circle cx="150" cy="34" r="24" fill="#08427B" stroke="#073B6F" stroke-width="1"/>
<text x="150" y="74" text-anchor="middle" fill="#FFFFFF" font-size="14">Personal Banking Customer</text>
<text x="150" y="94" text-anchor="middle" fill="#FFFFFF" font-size="14">[Person]</text>
<text x="150" y="114" text-anchor="middle" fill="#FFFFFF" font-size="14"></text>
<text x="150" y="134" text-anchor="middle" fill="#FFFFFF" font-size="14">A customer of the bank, with</text>
<text x="150" y="154" text-anchor="middle" fill="#FFFFFF" font-size="14">personal bank accounts.</text>
</g>
<g data-node="api">
<rect x="30" y="560" width="240" height="170" rx="8" fill="#438DD5" stroke="#3C7FC0" stroke-width="1"/>
<text x="150" y="590" text-anchor="middle" fill="#FFFFFF" font-size="14">API Application</text>
<text x="150" y="610" text-anchor="middle" fill="#FFFFFF" font-size="14">[Container: Java and Spring</text>
<text x="150" y="630" text-anchor="middle" fill="#FFFFFF" font-size="14">MVC]</text>
<text x="150" y="650" text-anchor="middle" fill="#FFFFFF" font-size="14"></text>
<text x="150" y="670" text-anchor="middle" fill="#FFFFFF" font-size="14">Provides Internet banking</text>
<text x="150" y="690" text-anchor="middle" fill="#FFFFFF" font-size="14">functionality via a JSON/HTTPS</text>
<text x="150" y="710" text-anchor="middle" fill="#FFFFFF" font-size="14">API.</text>
</g>
<g data-node="database">
<path d="M30 797 L30 973 A120 7 0 0 0 270 973 L270 797 A120 7 0 0 0 30 797 Z" fill="#438DD5" stroke="#3C7FC0" stroke-width="1"/>
<path d="M30 797 A120 7 0 0 0 270 797" fill="none" stroke="#3C7FC0" stroke-width="1"/>
<text x="150" y="834" text-anchor="middle" fill="#FFFFFF" font-size="14">Database</text>
<text x="150" y="854" text-anchor="middle" fill="#FFFFFF" font-size="14">[Container: Oracle Database</text>
<text x="150" y="874" text-anchor="middle" fill="#FFFFFF" font-size="14">Schema]</text>
<text x="150" y="894" text-anchor="middle" fill="#FFFFFF" font-size="14"></text>
<text x="150" y="914" text-anchor="middle" fill="#FFFFFF" font-size="14">Stores user registration</text>
<text x="150" y="934" text-anchor="middle" fill="#FFFFFF" font-size="14">information, hashed credentials,</text>
<text x="150" y="954" text-anchor="middle" fill="#FFFFFF" font-size="14">access logs, etc.</text>
</g>
<g data-node="spa">
<rect x="40" y="310" width="210" height="190" rx="8" fill="#438DD5" stroke="#3C7FC0" stroke-width="1"/>
<text x="145" y="340" text-anchor="middle" fill="#FFFFFF" font-size="14">Single-Page Application</text>
<text x="145" y="360" text-anchor="middle" fill="#FFFFFF" font-size="14">[Container: JavaScript and</text>
<text x="145" y="380" text-anchor="middle" fill="#FFFFFF" font-size="14">Angular]</text>
<text x="145" y="400" text-anchor="middle" fill="#FFFFFF" font-size="14"></text>
<text x="145" y="420" text-anchor="middle" fill="#FFFFFF" font-size="14">Provides all of the Internet</text>
<text x="145" y="440" text-anchor="middle" fill="#FFFFFF" font-size="14">banking functionality to</text>
<text x="145" y="460" text-anchor="middle" fill="#FFFFFF" font-size="14">customers via their web</text>
<text x="145" y="480" text-anchor="middle" fill="#FFFFFF" font-size="14">browser.</text>
</g>
<g data-edge="sign-in-1">
<path d="M148 170 L148 182 L201 182 L201 298 L148 298 L148 310" class="dg-flow-0" fill="none" stroke="#1168BD" stroke-width="1.5" stroke-dasharray="6 4"/>
<path d="M143 300 L148 310 L153 300" fill="none" stroke="#1168BD" stroke-width="1.5"/>
<rect x="131" y="232" width="140" height="16" fill="#FFFFFF"/>
<text x="201" y="244" text-anchor="middle" fill="#202124" font-size="11">1. Submits credentials to</text>
</g>
<g data-edge="sign-in-2">
<path d="M110 500 L110 560" class="dg-flow-0" fill="none" stroke="#1168BD" stroke-width="1.5" stroke-dasharray="6 4"/>
<path d="M105 550 L110 560 L115 550" fill="none" stroke="#1168BD" stroke-width="1.5"/>
<rect x="45" y="514" width="130" height="32" fill="#FFFFFF"/>
<text x="110" y="526" text-anchor="middle" fill="#202124" font-size="11">2. Sends credentials to</text>
<text x="110" y="542" text-anchor="middle" fill="#202124" font-size="11">[JSON/HTTPS]</text>
</g>
<g data-edge="sign-in-3">
<path d="M150 730 L150 790" class="dg-flow-0" fill="none" stroke="#1168BD" stroke-width="1.5" stroke-dasharray="6 4"/>
<path d="M145 780 L150 790 L155 780" fill="none" stroke="#1168BD" stroke-width="1.5"/>
<rect x="85" y="730" width="130" height="48" fill="#FFFFFF"/>
<text x="150" y="742" text-anchor="middle" fill="#202124" font-size="11">3. Validates credentials</text>
<text x="150" y="758" text-anchor="middle" fill="#202124" font-size="11">against</text>
<text x="150" y="774" text-anchor="middle" fill="#202124" font-size="11">[SQL/TCP]</text>
</g>
<g data-edge="sign-in-4">
<path d="M185 560 L185 500" class="dg-flow-0" fill="none" stroke="#1168BD" stroke-width="1.5" stroke-dasharray="6 4"/>
<path d="M190 510 L185 500 L180 510" fill="none" stroke="#1168BD" stroke-width="1.5"/>
<rect x="189" y="522" width="150" height="16" fill="#FFFFFF"/>
<text x="264" y="534" text-anchor="middle" fill="#202124" font-size="11">4. Returns a session token</text>
</g>
</svg>
