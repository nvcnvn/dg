<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 970 1390" width="970" height="1390" font-family="Inter, sans-serif">
<g data-node="banking">
<rect x="0" y="280" width="930" height="880" fill="none" stroke="#444444" stroke-width="1" stroke-dasharray="8 4"/>
<text x="20" y="305" fill="#444444" font-size="14">Internet Banking System</text>
<text x="20" y="325" fill="#444444" font-size="14">[Software System]</text>
</g>
<g data-node="customer">
<rect x="400" y="38" width="220" height="122" rx="24" fill="#08427B" stroke="#073B6F" stroke-width="1"/>
<circle cx="510" cy="24" r="24" fill="#08427B" stroke="#073B6F" stroke-width="1"/>
<text x="510" y="64" text-anchor="middle" fill="#FFFFFF" font-size="14">Personal Banking Customer</text>
<text x="510" y="84" text-anchor="middle" fill="#FFFFFF" font-size="14">[Person]</text>
<text x="510" y="104" text-anchor="middle" fill="#FFFFFF" font-size="14"></text>
<text x="510" y="124" text-anchor="middle" fill="#FFFFFF" font-size="14">A customer of the bank, with</text>
<text x="510" y="144" text-anchor="middle" fill="#FFFFFF" font-size="14">personal bank accounts.</text>
</g>
<g data-node="email">
<rect x="120" y="110" width="240" height="130" rx="8" fill="#999999" stroke="#8A8A8A" stroke-width="1"/>
<text x="240" y="140" text-anchor="middle" fill="#FFFFFF" font-size="14">E-mail System</text>
<text x="240" y="160" text-anchor="middle" fill="#FFFFFF" font-size="14">[Software System]</text>
<text x="240" y="180" text-anchor="middle" fill="#FFFFFF" font-size="14"></text>
<text x="240" y="200" text-anchor="middle" fill="#FFFFFF" font-size="14">The internal Microsoft Exchange</text>
<text x="240" y="220" text-anchor="middle" fill="#FFFFFF" font-size="14">e-mail system.</text>
</g>
<g data-node="mainframe">
<rect x="360" y="1200" width="220" height="150" rx="8" fill="#999999" stroke="#8A8A8A" stroke-width="1"/>
<text x="470" y="1230" text-anchor="middle" fill="#FFFFFF" font-size="14">Mainframe Banking System</text>
<text x="470" y="1250" text-anchor="middle" fill="#FFFFFF" font-size="14">[Software System]</text>
<text x="470" y="1270" text-anchor="middle" fill="#FFFFFF" font-size="14"></text>
<text x="470" y="1290" text-anchor="middle" fill="#FFFFFF" font-size="14">Stores all of the core banking</text>
<text x="470" y="1310" text-anchor="middle" fill="#FFFFFF" font-size="14">information about customers,</text>
<text x="470" y="1330" text-anchor="middle" fill="#FFFFFF" font-size="14">accounts, transactions, etc.</text>
</g>
<g data-node="api">
<rect x="420" y="650" width="240" height="170" rx="8" fill="#438DD5" stroke="#3C7FC0" stroke-width="1"/>
<text x="540" y="680" text-anchor="middle" fill="#FFFFFF" font-size="14">API Application</text>
<text x="540" y="700" text-anchor="middle" fill="#FFFFFF" font-size="14">[Container: Java and Spring</text>
<text x="540" y="720" text-anchor="middle" fill="#FFFFFF" font-size="14">MVC]</text>
<text x="540" y="740" text-anchor="middle" fill="#FFFFFF" font-size="14"></text>
<text x="540" y="760" text-anchor="middle" fill="#FFFFFF" font-size="14">Provides Internet banking</text>
<text x="540" y="780" text-anchor="middle" fill="#FFFFFF" font-size="14">functionality via a JSON/HTTPS</text>
<text x="540" y="800" text-anchor="middle" fill="#FFFFFF" font-size="14">API.</text>
</g>
<g data-node="database">
<path d="M420 957 L420 1133 A120 7 0 0 0 660 1133 L660 957 A120 7 0 0 0 420 957 Z" fill="#438DD5" stroke="#3C7FC0" stroke-width="1"/>
<path d="M420 957 A120 7 0 0 0 660 957" fill="none" stroke="#3C7FC0" stroke-width="1"/>
<text x="540" y="994" text-anchor="middle" fill="#FFFFFF" font-size="14">Database</text>
<text x="540" y="1014" text-anchor="middle" fill="#FFFFFF" font-size="14">[Container: Oracle Database</text>
<text x="540" y="1034" text-anchor="middle" fill="#FFFFFF" font-size="14">Schema]</text>
<text x="540" y="1054" text-anchor="middle" fill="#FFFFFF" font-size="14"></text>
<text x="540" y="1074" text-anchor="middle" fill="#FFFFFF" font-size="14">Stores user registration</text>
<text x="540" y="1094" text-anchor="middle" fill="#FFFFFF" font-size="14">information, hashed credentials,</text>
<text x="540" y="1114" text-anchor="middle" fill="#FFFFFF" font-size="14">access logs, etc.</text>
</g>
<g data-node="mobile-app">
<rect x="670" y="440" width="240" height="170" rx="8" fill="#438DD5" stroke="#3C7FC0" stroke-width="1"/>
<text x="790" y="470" text-anchor="middle" fill="#FFFFFF" font-size="14">Mobile App</text>
<text x="790" y="490" text-anchor="middle" fill="#FFFFFF" font-size="14">[Container: Xamarin]</text>
<text x="790" y="510" text-anchor="middle" fill="#FFFFFF" font-size="14"></text>
<text x="790" y="530" text-anchor="middle" fill="#FFFFFF" font-size="14">Provides a limited subset of the</text>
<text x="790" y="550" text-anchor="middle" fill="#FFFFFF" font-size="14">Internet banking functionality to</text>
<text x="790" y="570" text-anchor="middle" fill="#FFFFFF" font-size="14">customers via their mobile</text>
<text x="790" y="590" text-anchor="middle" fill="#FFFFFF" font-size="14">device.</text>
</g>
<g data-node="spa">
<rect x="420" y="350" width="210" height="190" rx="8" fill="#438DD5" stroke="#3C7FC0" stroke-width="1"/>
<text x="525" y="380" text-anchor="middle" fill="#FFFFFF" font-size="14">Single-Page Application</text>
<text x="525" y="400" text-anchor="middle" fill="#FFFFFF" font-size="14">[Container: JavaScript and</text>
<text x="525" y="420" text-anchor="middle" fill="#FFFFFF" font-size="14">Angular]</text>
<text x="525" y="440" text-anchor="middle" fill="#FFFFFF" font-size="14"></text>
<text x="525" y="460" text-anchor="middle" fill="#FFFFFF" font-size="14">Provides all of the Internet</text>
<text x="525" y="480" text-anchor="middle" fill="#FFFFFF" font-size="14">banking functionality to</text>
<text x="525" y="500" text-anchor="middle" fill="#FFFFFF" font-size="14">customers via their web</text>
<text x="525" y="520" text-anchor="middle" fill="#FFFFFF" font-size="14">browser.</text>
</g>
<g data-node="web-app">
<rect x="20" y="350" width="240" height="170" rx="8" fill="#438DD5" stroke="#3C7FC0" stroke-width="1"/>
<text x="140" y="380" text-anchor="middle" fill="#FFFFFF" font-size="14">Web Application</text>
<text x="140" y="400" text-anchor="middle" fill="#FFFFFF" font-size="14">[Container: Java and Spring</text>
<text x="140" y="420" text-anchor="middle" fill="#FFFFFF" font-size="14">MVC]</text>
<text x="140" y="440" text-anchor="middle" fill="#FFFFFF" font-size="14"></text>
<text x="140" y="460" text-anchor="middle" fill="#FFFFFF" font-size="14">Delivers the static content and</text>
<text x="140" y="480" text-anchor="middle" fill="#FFFFFF" font-size="14">the Internet banking single page</text>
<text x="140" y="500" text-anchor="middle" fill="#FFFFFF" font-size="14">application.</text>
</g>
